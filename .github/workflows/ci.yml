name: CI

# Required checks for pull requests, and the gate a production deploy waits on.
# Job names are the status-check names branch protection should require:
#   validate
#   smoke (chromium)
#   smoke (firefox)
#   smoke (webkit)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Cloud-off production build. The Pages workflow builds again with the
      # public repository variables; this step proves the bundle compiles
      # without talking to production Supabase.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
          VITE_CLOUD_SYNC: 'off'
          VITE_AUTH: 'off'

  smoke:
    name: smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Run 39895254662 cancelled smoke (webkit) at this job's old 15-minute
    # limit while `playwright install --with-deps webkit` was still fetching
    # apt packages (GTK, GStreamer, ffmpeg). The tests had not started, so
    # there was no Playwright trace. The image below matches the locked
    # Playwright version and already contains those libraries. Keep the tag in
    # sync with @playwright/test in package-lock.json.
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Do not pass --with-deps. That apt-installs WebKit's OS libraries from
      # the Ubuntu archive, and a slow mirror does not finish inside the job
      # budget. The browser binary is already in the image when versions match;
      # this only downloads one if the image and the package ever drift.
      - run: npx playwright install ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          CI: true
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
          VITE_CLOUD_SYNC: 'off'
          VITE_AUTH: 'off'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
